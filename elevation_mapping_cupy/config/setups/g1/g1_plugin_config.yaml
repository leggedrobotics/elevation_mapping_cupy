# Settings of the plugins. (The plugins should be stored in script/plugins)
min_filter:
  enable: True
  fill_nan: False
  is_height_layer: True
  layer_name: "min_filter"
  extra_params:
    dilation_size: 1
    iteration_n: 30

max_filter:
  enable: True
  fill_nan: False
  is_height_layer: True
  layer_name: "max_filter"
  extra_params:
    dilation_size: 5
    iteration_n: 10

smooth_filter:
  enable: True
  fill_nan: False
  is_height_layer: True
  layer_name: "smooth"
  extra_params:
    input_layer_name: "min_filter"

inpainting:
  enable: True
  fill_nan: False
  is_height_layer: True
  layer_name: "inpaint"
  extra_params:
    method: "telea"
    # ROS 1 behaviour: inpaint the whole invalid mask (the ROS 2 plugin otherwise fills only
    # bounded holes up to 64 cells and never holes touching the map border)
    max_hole_area: 0
    fill_border_holes: True

min_smooth_filter:
  enable: True
  fill_nan: False
  is_height_layer: True
  layer_name: "min_smooth_filter"
  extra_params:
    input_layer_name: "min_filter"
    size: 2
